<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <linearGradient id="muruGreenGradientWhiteMode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Wordmark in white for dark background -->
  <g fill="#FFFFFF">
    <text x="8" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="800" font-size="47" letter-spacing="-0.5">
      Muru<tspan dx="3">IT</tspan>
    </text>
  </g>

  <!-- Signature Muru curved green swoosh across the IT -->
  <path
    d="M 148,34 C 154,16 182,10 220,15 C 230,16 233,21 228,24 C 208,21 178,21 156,33 C 150,36 146,36 148,34 Z"
    fill="url(#muruGreenGradientWhiteMode)"
    filter="url(#neonGlow)"
  />

  <!-- Tagline: TECHNOLOGY SOLUTIONS GROUP -->
  <text
    x="10"
    y="74"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    font-weight="800"
    font-size="10.8"
    letter-spacing="4"
    fill="#D1D5DB"
  >
    TECHNOLOGY SOLUTIONS GROUP
  </text>
</svg>
